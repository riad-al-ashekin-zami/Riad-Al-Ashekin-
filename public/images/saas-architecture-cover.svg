<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0716" />
      <stop offset="50%" stop-color="#140e26" />
      <stop offset="100%" stop-color="#0d0818" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1635" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#120c24" stop-opacity="0.95" />
    </linearGradient>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#372659" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="160" fill="#7c3aed" opacity="0.22" filter="url(#glow)" />
  <circle cx="950" cy="400" r="180" fill="#06b6d4" opacity="0.18" filter="url(#glow)" />
  <circle cx="600" cy="300" r="220" fill="#a855f7" opacity="0.12" filter="url(#glow)" />

  <!-- Top Decorative Header Tag -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="230" height="32" rx="16" fill="#261745" stroke="#7c3aed" stroke-width="1.2" />
    <circle cx="16" cy="16" r="4" fill="#a855f7" />
    <text x="30" y="21" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ARCHITECTURAL BLUEPRINT</text>
  </g>

  <!-- Main Headline in Graphic -->
  <g transform="translate(80, 140)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Top 10 SaaS Development Companies</text>
    <text x="0" y="42" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600">Multi-Tenant Cloud Architecture &amp; Dedicated Agile Pods</text>
  </g>

  <!-- Central Architecture Diagram: Flow Nodes -->
  <g transform="translate(80, 240)">
    
    <!-- Left Pillar: Traffic & API Gateway -->
    <g transform="translate(0, 0)">
      <rect width="280" height="290" rx="18" fill="url(#card-grad)" stroke="#3f2963" stroke-width="1.5" />
      <rect x="20" y="20" width="42" height="42" rx="10" fill="#2d1c4f" />
      <!-- Cloud/Gateway Icon -->
      <path d="M32 38 C32 33 36 30 41 30 C45 30 48 33 49 36 C52 36 54 38 54 41 C54 44 52 46 49 46 L33 46 C30 46 28 44 28 41 C28 38 30 38 32 38 Z" fill="#c084fc" />
      <text x="74" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">1. Edge &amp; API Layer</text>
      <text x="74" y="55" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Tenant Routing &amp; Auth</text>
      
      <!-- Metrics & Badges inside node -->
      <g transform="translate(20, 85)">
        <rect width="240" height="42" rx="8" fill="#170f2b" stroke="#332050" />
        <text x="14" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Tenant Resolver (Subdomain / Header)</text>
      </g>
      <g transform="translate(20, 137)">
        <rect width="240" height="42" rx="8" fill="#170f2b" stroke="#332050" />
        <text x="14" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">JWT &amp; RBAC Token Validation</text>
      </g>
      <g transform="translate(20, 189)">
        <rect width="240" height="42" rx="8" fill="#170f2b" stroke="#332050" />
        <text x="14" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Rate Limiting per Tier / SLA</text>
      </g>
      <g transform="translate(20, 245)">
        <circle cx="6" cy="6" r="4" fill="#10b981" />
        <text x="18" y="10" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Latency: &lt;14ms at Edge</text>
      </g>
    </g>

    <!-- Connector Arrow 1 -->
    <path d="M 280 145 L 375 145" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6,4" />
    <polygon points="380,145 370,140 370,150" fill="#c084fc" />

    <!-- Center Pillar: Microservices & Pods -->
    <g transform="translate(380, 0)">
      <rect width="280" height="290" rx="18" fill="url(#card-grad)" stroke="#7c3aed" stroke-width="2" />
      <rect x="20" y="20" width="42" height="42" rx="10" fill="#3a1c6e" />
      <!-- Server/Pods Icon -->
      <rect x="30" y="32" width="22" height="6" rx="2" fill="#d8b4fe" />
      <rect x="30" y="42" width="22" height="6" rx="2" fill="#d8b4fe" />
      <text x="74" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">2. Dedicated Pods</text>
      <text x="74" y="55" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Core Business &amp; Billing</text>
      
      <!-- Metrics & Badges inside node -->
      <g transform="translate(20, 85)">
        <rect width="240" height="42" rx="8" fill="#20113c" stroke="#4c2980" />
        <text x="14" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">A2Z DevCenter Pod Model (#1)</text>
      </g>
      <g transform="translate(20, 137)">
        <rect width="240" height="42" rx="8" fill="#20113c" stroke="#4c2980" />
        <text x="14" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Stripe Billing &amp; Usage Metering</text>
      </g>
      <g transform="translate(20, 189)">
        <rect width="240" height="42" rx="8" fill="#20113c" stroke="#4c2980" />
        <text x="14" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Async Workers &amp; Event Queues</text>
      </g>
      <g transform="translate(20, 245)">
        <circle cx="6" cy="6" r="4" fill="#a855f7" />
        <text x="18" y="10" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Sprint Velocity: 2-Wk Cadence</text>
      </g>
    </g>

    <!-- Connector Arrow 2 -->
    <path d="M 660 145 L 755 145" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="6,4" />
    <polygon points="760,145 750,140 750,150" fill="#38bdf8" />

    <!-- Right Pillar: Multi-Tenant Data Isolation -->
    <g transform="translate(760, 0)">
      <rect width="280" height="290" rx="18" fill="url(#card-grad)" stroke="#1e3a5f" stroke-width="1.5" />
      <rect x="20" y="20" width="42" height="42" rx="10" fill="#0d2b45" />
      <!-- Database Shard Icon -->
      <ellipse cx="41" cy="34" rx="11" ry="4" fill="#38bdf8" />
      <path d="M30 34 v 8 c 0 2.2 4.9 4 11 4 s 11 -1.8 11 -4 v -8" fill="#0284c7" />
      <path d="M30 44 v 8 c 0 2.2 4.9 4 11 4 s 11 -1.8 11 -4 v -8" fill="#0369a1" />
      <text x="74" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">3. Data Isolation</text>
      <text x="74" y="55" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Postgres RLS &amp; Shards</text>
      
      <!-- Metrics & Badges inside node -->
      <g transform="translate(20, 85)">
        <rect width="240" height="42" rx="8" fill="#0b1b2e" stroke="#1d4069" />
        <text x="14" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Row-Level Security (RLS) Policies</text>
      </g>
      <g transform="translate(20, 137)">
        <rect width="240" height="42" rx="8" fill="#0b1b2e" stroke="#1d4069" />
        <text x="14" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Schema-per-Tenant Automation</text>
      </g>
      <g transform="translate(20, 189)">
        <rect width="240" height="42" rx="8" fill="#0b1b2e" stroke="#1d4069" />
        <text x="14" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">SOC2 &amp; HIPAA Data Governance</text>
      </g>
      <g transform="translate(20, 245)">
        <circle cx="6" cy="6" r="4" fill="#38bdf8" />
        <text x="18" y="10" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Data Leak Risk: 0.00% Zero-Trust</text>
      </g>
    </g>

  </g>

  <!-- Bottom Evaluation Badge Bar -->
  <g transform="translate(80, 560)">
    <rect width="1040" height="42" rx="10" fill="#130b24" stroke="#2e1a52" />
    <text x="24" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      <tspan font-weight="700" fill="#ffffff">Evaluated Agencies:</tspan> A2Z DevCenter • Thoughtbot • ScienceSoft • 10Clouds • Monterail • STRV • Simform • PixelCrayons • Altar.io • Konstant
    </text>
    <text x="880" y="26" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Riad Al Ashekin Advisory</text>
  </g>
</svg>
