<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="spa-seo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070414" />
      <stop offset="45%" stop-color="#0f0c29" />
      <stop offset="100%" stop-color="#071126" />
    </linearGradient>
    <linearGradient id="spa-seo-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="spa-seo-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181135" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#0c0720" stop-opacity="0.98" />
    </linearGradient>
    <pattern id="spa-seo-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b2568" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>
    <filter id="spa-seo-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#spa-seo-bg)" />
  <rect width="1200" height="630" fill="url(#spa-seo-grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="160" r="190" fill="#6366f1" opacity="0.22" filter="url(#spa-seo-glow-filter)" />
  <circle cx="1020" cy="380" r="210" fill="#06b6d4" opacity="0.22" filter="url(#spa-seo-glow-filter)" />
  <circle cx="620" cy="260" r="230" fill="#a855f7" opacity="0.16" filter="url(#spa-seo-glow-filter)" />

  <!-- Top Badge -->
  <g transform="translate(80, 56)">
    <rect x="0" y="0" width="375" height="34" rx="17" fill="#1b123d" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#38bdf8" />
    <text x="32" y="22" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1.5">TECHNICAL SEO • ARCHITECTURE BLUEPRINT</text>
  </g>

  <!-- Headline & Subtitle -->
  <g transform="translate(80, 132)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.8">SEO for Single Page Applications</text>
    <text x="0" y="42" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="600">How to Optimize SPAs for Google: Routing, SSR, Indexing &amp; Crawlability</text>
  </g>

  <!-- Left: Googlebot SPA Processing Pipeline -->
  <g transform="translate(80, 222)">
    <rect width="530" height="318" rx="20" fill="url(#spa-seo-card)" stroke="#452d79" stroke-width="1.2" />

    <!-- Terminal Header -->
    <g transform="translate(24, 20)">
      <circle cx="8" cy="8" r="5" fill="#ef4444" opacity="0.8" />
      <circle cx="26" cy="8" r="5" fill="#f59e0b" opacity="0.8" />
      <circle cx="44" cy="8" r="5" fill="#10b981" opacity="0.8" />
      <text x="70" y="12" fill="#94a3b8" font-family="monospace" font-size="11">googlebot-spa-rendering-pipeline.log</text>
    </g>

    <!-- Pipeline Step 1: Initial Crawl -->
    <g transform="translate(24, 60)">
      <rect width="482" height="48" rx="10" fill="#120c29" stroke="#312053" stroke-width="1" />
      <circle cx="24" cy="24" r="10" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1.2" />
      <text x="21" y="28" fill="#93c5fd" font-family="monospace" font-size="10" font-weight="bold">1</text>
      <text x="46" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Initial HTTP Fetch</text>
      <text x="46" y="38" fill="#94a3b8" font-family="monospace" font-size="10">GET /route ──&gt; Returns Shell HTML + JS Bundle</text>
      <rect x="400" y="14" width="70" height="20" rx="5" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="0.8" />
      <text x="412" y="28" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">WAVE 1</text>
    </g>

    <!-- Connector Arrow 1 -->
    <g transform="translate(250, 110)">
      <path d="M 0 0 L 0 10 M -3 7 L 0 10 L 3 7" stroke="#818cf8" stroke-width="1.4" fill="none" />
    </g>

    <!-- Pipeline Step 2: Render Queue -->
    <g transform="translate(24, 122)">
      <rect width="482" height="48" rx="10" fill="#120c29" stroke="#312053" stroke-width="1" />
      <circle cx="24" cy="24" r="10" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.2" />
      <text x="21" y="28" fill="#fde68a" font-family="monospace" font-size="10" font-weight="bold">2</text>
      <text x="46" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Deferred Render Queue</text>
      <text x="46" y="38" fill="#94a3b8" font-family="monospace" font-size="10">Waits for WRS resource budget &amp; compute</text>
      <rect x="382" y="14" width="88" height="20" rx="5" fill="#d97706" fill-opacity="0.2" stroke="#fbbf24" stroke-width="0.8" />
      <text x="394" y="28" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="bold">RENDER QUEUE</text>
    </g>

    <!-- Connector Arrow 2 -->
    <g transform="translate(250, 172)">
      <path d="M 0 0 L 0 10 M -3 7 L 0 10 L 3 7" stroke="#818cf8" stroke-width="1.4" fill="none" />
    </g>

    <!-- Pipeline Step 3: WRS Execution & Hydration -->
    <g transform="translate(24, 184)">
      <rect width="482" height="48" rx="10" fill="#120c29" stroke="#312053" stroke-width="1" />
      <circle cx="24" cy="24" r="10" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-width="1.2" />
      <text x="21" y="28" fill="#c4b5fd" font-family="monospace" font-size="10" font-weight="bold">3</text>
      <text x="46" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Headless Chromium Execution</text>
      <text x="46" y="38" fill="#94a3b8" font-family="monospace" font-size="10">Executes JS, resolves APIs, renders full DOM</text>
      <rect x="400" y="14" width="70" height="20" rx="5" fill="#7c3aed" fill-opacity="0.2" stroke="#a78bfa" stroke-width="0.8" />
      <text x="412" y="28" fill="#c4b5fd" font-family="monospace" font-size="9" font-weight="bold">WAVE 2</text>
    </g>

    <!-- Connector Arrow 3 -->
    <g transform="translate(250, 234)">
      <path d="M 0 0 L 0 10 M -3 7 L 0 10 L 3 7" stroke="#818cf8" stroke-width="1.4" fill="none" />
    </g>

    <!-- Pipeline Step 4: Full Indexation -->
    <g transform="translate(24, 246)">
      <rect width="482" height="48" rx="10" fill="#0d1b18" stroke="#065f46" stroke-width="1" />
      <circle cx="24" cy="24" r="10" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1.2" />
      <text x="21" y="28" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="bold">4</text>
      <text x="46" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Rendered DOM Indexing</text>
      <text x="46" y="38" fill="#a7f3d0" font-family="monospace" font-size="10">Extracts semantic &lt;a href&gt;, metadata &amp; content</text>
      <rect x="390" y="14" width="80" height="20" rx="5" fill="#059669" fill-opacity="0.2" stroke="#34d399" stroke-width="0.8" />
      <text x="402" y="28" fill="#34d399" font-family="monospace" font-size="9" font-weight="bold">INDEXED ✓</text>
    </g>
  </g>

  <!-- Right: Architecture Matrix & Optimization Pillars -->
  <g transform="translate(635, 222)">
    <rect width="485" height="318" rx="20" fill="url(#spa-seo-card)" stroke="#452d79" stroke-width="1.2" />

    <!-- Matrix Header -->
    <g transform="translate(24, 20)">
      <text x="0" y="12" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">SPA ARCHITECTURE DECISION MATRIX</text>
      <text x="0" y="28" fill="#818cf8" font-family="monospace" font-size="10">HYBRID RENDERING VS PURE CSR</text>
    </g>

    <!-- Strategy 1: Public Pages (SSR / SSG) -->
    <g transform="translate(24, 62)">
      <rect width="437" height="68" rx="12" fill="#130e2b" stroke="#3a2266" stroke-width="1" />
      <rect x="14" y="14" width="36" height="36" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
      <path d="M 24 32 L 32 40 L 44 24" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="60" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Public &amp; SEO Pages ──&gt; SSR / SSG</text>
      <text x="60" y="44" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Pre-rendered HTML sent directly to search bots</text>
      <text x="60" y="58" fill="#34d399" font-family="monospace" font-size="10">Zero render queue wait • Instant indexation</text>
    </g>

    <!-- Strategy 2: Authenticated / Dashboards (CSR) -->
    <g transform="translate(24, 140)">
      <rect width="437" height="68" rx="12" fill="#130e2b" stroke="#3a2266" stroke-width="1" />
      <rect x="14" y="14" width="36" height="36" rx="8" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="1" />
      <circle cx="32" cy="32" r="10" stroke="#818cf8" stroke-width="2" fill="none" />
      <path d="M 32 26 L 32 32 L 36 34" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <text x="60" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Authenticated App ──&gt; Client-Side SPA</text>
      <text x="60" y="44" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Protected behind login (no public SEO requirement)</text>
      <text x="60" y="58" fill="#818cf8" font-family="monospace" font-size="10">Fluid user state • Fast client transitions</text>
    </g>

    <!-- Strategy 3: Critical Requirements Checklist -->
    <g transform="translate(24, 218)">
      <rect width="437" height="78" rx="12" fill="#0b1726" stroke="#15426b" stroke-width="1" />
      <g transform="translate(16, 16)">
        <text x="0" y="10" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">CORE TECHNICAL COMPLIANCE:</text>
        <text x="0" y="28" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">• HTML5 History API (no hash #! routing)</text>
        <text x="0" y="44" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">• Semantic &lt;a href&gt; internal link architecture</text>
        <text x="230" y="28" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">• Server HTTP 404 status codes</text>
        <text x="230" y="44" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">• Dynamic &lt;title&gt; &amp; &lt;link rel="canonical"&gt;</text>
      </g>
    </g>
  </g>

  <!-- Bottom Specifications Bar -->
  <g transform="translate(80, 564)">
    <rect width="1040" height="38" rx="10" fill="#100b24" stroke="#2a184c" stroke-width="1" />
    <text x="24" y="24" fill="#818cf8" font-family="monospace" font-size="11" font-weight="bold">STANDARDS:</text>
    <text x="110" y="24" fill="#c7d2fe" font-family="monospace" font-size="11">Googlebot WRS • HTML5 History API • Hybrid SSR/SSG • Semantic DOM • Real 404s</text>
    <text x="910" y="24" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">1200 × 630 HD</text>
  </g>
</svg>
