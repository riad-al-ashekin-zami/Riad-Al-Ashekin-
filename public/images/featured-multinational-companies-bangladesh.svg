        <rect width="448" height="42" rx="10" fill="#0d244c" stroke="#1f4175" stroke-width="1" />
        <circle cx="20" cy="21" r="7" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
        <path d="M 17 21 L 19 23 L 23 18" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <text x="38" y="25" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Pharma &amp; Healthcare</text>
        <text x="185" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500">• Novo Nordisk, Novartis, Roche, Bayer</text>
      </g>

      <!-- Row 5 -->
      <g transform="translate(0, 200)">
        <rect width="448" height="42" rx="10" fill="#0d244c" stroke="#1f4175" stroke-width="1" />
        <circle cx="20" cy="21" r="7" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
        <path d="M 17 21 L 19 23 L 23 18" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <text x="38" y="25" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Logistics, Energy &amp; Engineering</text>
        <text x="250" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500">• DHL, Maersk, Chevron, Siemens</text>
