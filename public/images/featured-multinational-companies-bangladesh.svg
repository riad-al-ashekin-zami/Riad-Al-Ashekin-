        <circle cx="18" cy="21" r="5" fill="#a78bfa" />
        <text x="32" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Marico Bangladesh</text>
