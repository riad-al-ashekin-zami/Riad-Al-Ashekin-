<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="mnc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a" />
      <stop offset="50%" stop-color="#0b1c38" />
      <stop offset="100%" stop-color="#040c18" />
    </linearGradient>
    <linearGradient id="mnc-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#122752" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#091632" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="mnc-card-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162e5e" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0a1a38" stop-opacity="0.98" />
    </linearGradient>
    <pattern id="mnc-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d3b70" stroke-width="0.8" stroke-opacity="0.3" />
    </pattern>
    <filter id="mnc-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="38" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#mnc-bg)" />
  <rect width="1200" height="630" fill="url(#mnc-grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="190" cy="160" r="200" fill="#38bdf8" opacity="0.20" filter="url(#mnc-glow-filter)" />
  <circle cx="1030" cy="380" r="230" fill="#6366f1" opacity="0.22" filter="url(#mnc-glow-filter)" />
  <circle cx="610" cy="240" r="240" fill="#06b6d4" opacity="0.14" filter="url(#mnc-glow-filter)" />

  <!-- Top Badge -->
  <g transform="translate(80, 56)">
    <rect x="0" y="0" width="425" height="34" rx="17" fill="#0c234b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#38bdf8" />
    <text x="32" y="22" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1.5">GLOBAL ENTERPRISES • BANGLADESH MARKET REPORT</text>
  </g>

  <!-- Headline & Subtitle -->
  <g transform="translate(80, 132)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" letter-spacing="-0.8">Multinational Companies in Bangladesh</text>
    <text x="0" y="42" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">Top MNCs, Key Industries, Career Opportunities &amp; Executive Recruitment Guide</text>
  </g>

  <!-- Left: Flagship Multinationals Card -->
