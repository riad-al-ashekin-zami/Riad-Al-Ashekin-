        <text x="38" y="25" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Global Banking &amp; Finance</text>
        <text x="210" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500">• Standard Chartered, HSBC, Citi</text>
      </g>

