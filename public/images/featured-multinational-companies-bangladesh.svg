  <!-- Bottom Stats Bar -->
  <g transform="translate(80, 560)">
    <rect width="1040" height="44" rx="12" fill="#091b3b" stroke="#1f4277" stroke-width="1" />
    <text x="28" y="27" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">12+ ECONOMIC SECTORS</text>
    <text x="215" y="27" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">•</text>
    <text x="240" y="27" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Multinational Investment Ecosystem</text>
    <text x="475" y="27" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">•</text>
    <text x="500" y="27" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Executive &amp; Graduate Recruitment Guide</text>
    <text x="775" y="27" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">•</text>
    <text x="800" y="27" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Riad Al Ashekin Advisory</text>
