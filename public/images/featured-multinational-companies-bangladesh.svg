        <rect width="228" height="42" rx="10" fill="#0e264f" stroke="#1f4376" stroke-width="1" />
        <circle cx="18" cy="21" r="5" fill="#fbbf24" />
        <text x="32" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Chevron Bangladesh</text>
