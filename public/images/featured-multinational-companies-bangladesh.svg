    <rect width="520" height="318" rx="20" fill="url(#mnc-card)" stroke="#204278" stroke-width="1.2" />

    <!-- Card Header Tag -->
    <g transform="translate(24, 20)">
      <rect width="250" height="26" rx="13" fill="#0f2f60" stroke="#38bdf8" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#38bdf8" />
      <text x="26" y="17" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1">MAJOR OPERATING CORPORATIONS</text>
    </g>

