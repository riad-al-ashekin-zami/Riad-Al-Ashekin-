<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="soft-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1c" />
      <stop offset="45%" stop-color="#0d1836" />
      <stop offset="100%" stop-color="#061225" />
    </linearGradient>
    <linearGradient id="soft-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142145" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#09132d" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
