    <text x="0" y="42" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="600">Top Software Development Companies, ERP Specialists &amp; Global Engineering Firms</text>
