<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="meta-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#140d27" />
      <stop offset="100%" stop-color="#0a1224" />
    </linearGradient>
    <linearGradient id="title-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="serp-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="meta-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1235" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0f0920" stop-opacity="0.97" />
    </linearGradient>
    <pattern id="meta-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b2568" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>
    <filter id="meta-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#meta-bg)" />
  <rect width="1200" height="630" fill="url(#meta-grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="220" cy="180" r="180" fill="#818cf8" opacity="0.24" filter="url(#meta-glow)" />
  <circle cx="980" cy="360" r="190" fill="#06b6d4" opacity="0.22" filter="url(#meta-glow)" />
  <circle cx="600" cy="280" r="220" fill="#a855f7" opacity="0.14" filter="url(#meta-glow)" />

  <!-- Top Badge -->
  <g transform="translate(80, 65)">
    <rect x="0" y="0" width="300" height="34" rx="17" fill="#1e133d" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#38bdf8" />
    <text x="32" y="22" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1.5">TECHNICAL SEO • STEP-BY-STEP</text>
  </g>

  <!-- Headline -->
  <g transform="translate(80, 142)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.8">How to Create Perfect Meta Titles</text>
    <text x="0" y="44" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600">Pixel Width Limits, Character Benchmarks &amp; CTR Formula</text>
  </g>

  <!-- Left: Live SERP Simulation Box -->
  <g transform="translate(80, 235)">
    <rect width="560" height="290" rx="20" fill="url(#meta-card)" stroke="#452d79" stroke-width="1.2" />

    <!-- Browser Tab Simulation Header -->
    <g transform="translate(24, 20)">
      <circle cx="8" cy="8" r="5" fill="#ef4444" opacity="0.8" />
      <circle cx="26" cy="8" r="5" fill="#f59e0b" opacity="0.8" />
      <circle cx="44" cy="8" r="5" fill="#10b981" opacity="0.8" />
      
      <rect x="65" y="-2" width="280" height="20" rx="10" fill="#130b26" stroke="#2d1c52" stroke-width="1" />
      <text x="78" y="12" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">https://google.com/search?q=seo</text>
    </g>

    <!-- Simulated Google SERP Snippet -->
    <g transform="translate(24, 65)">
      <!-- URL breadcrumb -->
      <g transform="translate(0, 0)">
        <circle cx="8" cy="8" r="7" fill="#221542" />
        <text x="24" y="12" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">https://riadalashekin.com <tspan fill="#64748b">&gt; blog &gt; meta-titles</tspan></text>
      </g>

      <!-- Clickable Title (Blue Google style with high contrast) -->
      <g transform="translate(0, 36)">
        <text x="0" y="0" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">How to Create Perfect Meta Titles for SEO (2026 Guide)</text>
      </g>

      <!-- Description Snippet -->
      <g transform="translate(0, 68)">
        <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400">Step-by-step blueprint to optimize title tags within the 580px limit.</text>
        <text x="0" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400">Maximize click-through rates, eradicate truncation, and align intent.</text>
      </g>

      <!-- Pixel Width Gauge -->
      <g transform="translate(0, 118)">
        <rect width="512" height="42" rx="10" fill="#130b26" stroke="#2f1d56" stroke-width="1" />
        <text x="14" y="26" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">WIDTH: 540px / 580px (SAFE)</text>
        <text x="360" y="26" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">CHARS: 56 / 60</text>
      </g>
    </g>
  </g>

  <!-- Right: Technical CTR Architecture & Code Card -->
  <g transform="translate(665, 235)">
    <rect width="455" height="290" rx="20" fill="url(#meta-card)" stroke="#452d79" stroke-width="1.2" />

    <g transform="translate(26, 26)">
      <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">Formula &amp; HTML Syntax</text>
      <text x="0" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">Search engine compliance architecture</text>
    </g>

    <!-- Code Block -->
    <g transform="translate(26, 75)">
      <rect width="403" height="65" rx="12" fill="#0d071a" stroke="#2e1b52" stroke-width="1" />
      <text x="16" y="26" fill="#f43f5e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">&lt;<tspan fill="#a855f7">title</tspan>&gt;</text>
      <text x="16" y="46" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Primary Keyword | Secondary Hook</text>
      <text x="295" y="46" fill="#f43f5e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">&lt;/<tspan fill="#a855f7">title</tspan>&gt;</text>
    </g>

    <!-- Key Metrics Pills -->
    <g transform="translate(26, 160)">
      <g transform="translate(0, 0)">
        <rect width="190" height="75" rx="12" fill="#130b26" stroke="#36225e" stroke-width="1" />
        <text x="14" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">OPTIMAL LENGTH</text>
        <text x="14" y="52" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900">50-60</text>
        <text x="85" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Characters</text>
      </g>

      <g transform="translate(210, 0)">
        <rect width="190" height="75" rx="12" fill="#130b26" stroke="#36225e" stroke-width="1" />
        <text x="14" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">CTR LIFT</text>
        <text x="14" y="52" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900">+34%</text>
        <text x="80" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Average</text>
      </g>
    </g>
  </g>

  <!-- Watermark Footer -->
  <g transform="translate(80, 580)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">RIADALASHEKIN.COM • TECHNICAL SEO ARCHITECTURE</text>
    <text x="1040" y="0" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">2026 GUIDE</text>
  </g>
</svg>
