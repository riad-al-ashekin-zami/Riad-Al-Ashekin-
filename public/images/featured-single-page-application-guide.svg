<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="spa-bg-new" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070414" />
      <stop offset="45%" stop-color="#120a28" />
      <stop offset="100%" stop-color="#080e22" />
    </linearGradient>
    <linearGradient id="spa-card-new" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c113d" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#0e0724" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="spa-card-right-new" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181035" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0d0922" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="purple-cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <pattern id="spa-grid-new" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b2568" stroke-width="0.8" stroke-opacity="0.32" />
    </pattern>
    <filter id="spa-glow-filter-new" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="38" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#spa-bg-new)" />
  <rect width="1200" height="630" fill="url(#spa-grid-new)" />

  <!-- Ambient Light Orbs -->
  <circle cx="190" cy="160" r="190" fill="#818cf8" opacity="0.22" filter="url(#spa-glow-filter-new)" />
  <circle cx="1030" cy="380" r="220" fill="#06b6d4" opacity="0.20" filter="url(#spa-glow-filter-new)" />
  <circle cx="610" cy="240" r="240" fill="#c084fc" opacity="0.15" filter="url(#spa-glow-filter-new)" />

  <!-- Top Badge -->
  <g transform="translate(80, 56)">
    <rect x="0" y="0" width="425" height="34" rx="17" fill="#1e1042" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#38bdf8" />
    <text x="32" y="22" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1.5">ENTERPRISE ARCHITECTURE • SPA TECHNICAL GUIDE</text>
  </g>

  <!-- Headline & Subtitle -->
  <g transform="translate(80, 132)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" letter-spacing="-0.8">What Is a Single Page Application (SPA)?</text>
    <text x="0" y="42" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">Complete Guide to SPA Apps, JavaScript, Architecture, SEO &amp; Examples</text>
  </g>

  <!-- Left: SPA Runtime Lifecycle Box -->
  <g transform="translate(80, 222)">
    <rect width="520" height="318" rx="20" fill="url(#spa-card-new)" stroke="#452d79" stroke-width="1.2" />

    <!-- Terminal Header Bar -->
    <g transform="translate(24, 20)">
      <circle cx="8" cy="8" r="5" fill="#ef4444" opacity="0.8" />
      <circle cx="26" cy="8" r="5" fill="#f59e0b" opacity="0.8" />
      <circle cx="44" cy="8" r="5" fill="#10b981" opacity="0.8" />
      <text x="70" y="12" fill="#94a3b8" font-family="monospace" font-size="11">browser-spa-lifecycle.tsx</text>
      <rect x="360" y="0" width="112" height="20" rx="10" fill="#20114a" stroke="#818cf8" stroke-width="0.8" />
      <text x="372" y="14" fill="#c7d2fe" font-family="monospace" font-size="9.5" font-weight="bold">SPA RUNTIME</text>
    </g>

    <!-- Pipeline Step 1 -->
    <g transform="translate(24, 58)">
      <rect width="472" height="52" rx="10" fill="#140b2e" stroke="#6366f1" stroke-width="1" />
      <circle cx="20" cy="26" r="10" fill="#6366f1" fill-opacity="0.25" />
      <text x="20" y="30" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="11" font-weight="bold">1</text>
      <text x="42" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Initial HTML Document Shell</text>
      <text x="42" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Single &lt;div id="root"&gt; page load + asynchronous JavaScript bundles</text>
    </g>

    <!-- Pipeline Step 2 -->
    <g transform="translate(24, 120)">
      <rect width="472" height="52" rx="10" fill="#140b2e" stroke="#06b6d4" stroke-width="1" />
      <circle cx="20" cy="26" r="10" fill="#06b6d4" fill-opacity="0.25" />
      <text x="20" y="30" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">2</text>
      <text x="42" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Client-Side Routing &amp; History API</text>
      <text x="42" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">window.history.pushState updates views instantly with no white flash</text>
    </g>

    <!-- Pipeline Step 3 -->
    <g transform="translate(24, 182)">
      <rect width="472" height="52" rx="10" fill="#140b2e" stroke="#10b981" stroke-width="1" />
      <circle cx="20" cy="26" r="10" fill="#10b981" fill-opacity="0.25" />
      <text x="20" y="30" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">3</text>
      <text x="42" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Reactive API Hydration &amp; State</text>
      <text x="42" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">JSON endpoints feed reactive components • Persistent application memory</text>
    </g>

    <!-- Bottom Status Strip -->
    <g transform="translate(24, 246)">
      <rect width="472" height="48" rx="8" fill="#0f0722" stroke="#372061" stroke-width="1" />
      <text x="14" y="28" fill="#38bdf8" font-family="monospace" font-size="11">✓ Crawlable &lt;a&gt; Links</text>
      <text x="175" y="28" fill="#a78bfa" font-family="monospace" font-size="11">✓ PushState URLs</text>
      <text x="320" y="28" fill="#34d399" font-family="monospace" font-size="11">✓ Pre-render / SSR</text>
    </g>
  </g>

  <!-- Right: Architecture Matrix Cards -->
  <g transform="translate(630, 222)">
    <rect width="490" height="318" rx="20" fill="url(#spa-card-right-new)" stroke="#452d79" stroke-width="1.2" />

    <!-- Card 1: Framework Ecosystem -->
    <g transform="translate(24, 22)">
      <rect width="442" height="82" rx="14" fill="#180e36" stroke="#482d7c" stroke-width="1" />
      <circle cx="34" cy="41" r="20" fill="#38bdf8" fill-opacity="0.15" />
      <text x="34" y="47" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="18">⚡</text>
      <text x="68" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Modern Frameworks &amp; Tooling</text>
      <text x="68" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">React, Vue.js, Angular, Svelte &amp; Next.js hybrid architecture</text>
      <text x="68" y="68" fill="#818cf8" font-family="monospace" font-size="10">Component Hierarchy • Virtual DOM • Fast Refresh</text>
    </g>

    <!-- Card 2: SPA SEO & Googlebot Pipeline -->
    <g transform="translate(24, 118)">
      <rect width="442" height="82" rx="14" fill="#180e36" stroke="#482d7c" stroke-width="1" />
      <circle cx="34" cy="41" r="20" fill="#10b981" fill-opacity="0.15" />
      <text x="34" y="47" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="18">🔍</text>
      <text x="68" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">JavaScript SEO &amp; Indexation Pipeline</text>
      <text x="68" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">Googlebot WRS render queue, soft-404 handling &amp; title updates</text>
      <text x="68" y="68" fill="#34d399" font-family="monospace" font-size="10">Semantic Anchors • Dynamic Meta Tags • SSG Snapshots</text>
    </g>

    <!-- Card 3: SPA vs MPA Tradeoffs -->
    <g transform="translate(24, 214)">
      <rect width="442" height="82" rx="14" fill="#180e36" stroke="#482d7c" stroke-width="1" />
      <circle cx="34" cy="41" r="20" fill="#c084fc" fill-opacity="0.15" />
      <text x="34" y="47" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="18">⇄</text>
      <text x="68" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">SPA vs MPA Architectural Tradeoffs</text>
      <text x="68" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">Fluid native app UX vs traditional multi-page document simplicity</text>
      <text x="68" y="68" fill="#c084fc" font-family="monospace" font-size="10">Sub-second Routing • Optimistic UI • Decoupled Backend</text>
    </g>
  </g>

  <!-- Author Signature Footer -->
  <g transform="translate(80, 574)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Riad Al Ashekin Advisory</text>
    <text x="175" y="0" fill="#475569" font-family="sans-serif" font-size="13">•</text>
    <text x="190" y="0" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">riadalashekin.com/what-is-a-single-page-application/</text>
  </g>
</svg>
