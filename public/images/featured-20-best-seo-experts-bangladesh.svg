        <text x="16" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">TECHNICAL AUDIT DEPTH</text>
        <text x="16" y="54" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900">45-Point</text>
        <text x="16" y="72" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Architectural Vetting</text>
      </g>

      <!-- Quadrant 2 -->
      <g transform="translate(235, 0)">
        <rect width="215" height="85" rx="14" fill="#140c26" stroke="#382161" stroke-width="1" />
        <text x="16" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">PRACTITIONERS AUDITED</text>
        <text x="16" y="54" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900">20 Experts</text>
        <text x="16" y="72" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Nationwide Selection</text>
      </g>

      <!-- Quadrant 3 -->
