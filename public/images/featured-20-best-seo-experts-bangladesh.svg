        <text x="16" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">WHITE-HAT COMPLIANCE</text>
        <text x="16" y="54" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900">100%</text>
        <text x="16" y="72" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Google Policy Aligned</text>
      </g>

      <!-- Quadrant 4 -->
      <g transform="translate(235, 105)">
        <rect width="215" height="85" rx="14" fill="#140c26" stroke="#382161" stroke-width="1" />
        <text x="16" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">ENTERPRISE CONVERSIONS</text>
        <text x="16" y="54" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900">4.8x</text>
        <text x="16" y="72" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Median ROI Multiplier</text>
      </g>
    </g>
  </g>

  <!-- Watermark Footer -->
  <g transform="translate(80, 580)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">RIADALASHEKIN.COM • NATIONAL SEARCH LEADERSHIP DIRECTORY</text>
    <text x="1040" y="0" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">2026 EDITION</text>
  </g>
</svg>
